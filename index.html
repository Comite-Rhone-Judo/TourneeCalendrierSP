<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet de tournée</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tournée">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Concept : la page du carnet papier, plein écran, lisible de nuit. Thème sombre d'abord. */
:root{--bg:#000;--sheet:#15171a;--raised:#262a2f;--line:#5a606a;--ink:#fff;--mut:#bcc2ca;--floor:#6b7079;--floor-ink:#fff;
--x:#2fd36f;--x-ink:#00210d;--a:#ffcf33;--a-ink:#000;--r:#ff5b50;--r-ink:#000;--danger:#ff7a70;--warn-bg:#3a2f00;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ebee;--sheet:#fff;--raised:#dcdfe3;--line:#2b2e33;--ink:#000;--mut:#454a51;--floor:#646971;--floor-ink:#fff;
--x:#0d8a40;--x-ink:#fff;--a:#ffc400;--a-ink:#000;--r:#d3261c;--r-ink:#fff;--danger:#b81f16;--warn-bg:#fff0b8;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9ebee;--sheet:#fff;--raised:#dcdfe3;--line:#2b2e33;--ink:#000;--mut:#454a51;--floor:#646971;--floor-ink:#fff;
--x:#0d8a40;--x-ink:#fff;--a:#ffc400;--a-ink:#000;--r:#d3261c;--r-ink:#fff;--danger:#b81f16;--warn-bg:#fff0b8;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px/1.3 var(--font);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
.btn{min-height:54px;padding:0 16px;border-radius:8px;background:var(--raised);font-weight:600;text-align:center;width:100%}
.btn.main{background:var(--ink);color:var(--bg);font-size:20px;font-weight:700}
.btn.danger{color:var(--danger);background:none;border:2px solid var(--danger)}
.foot{flex:none;padding:8px 8px}

/* Page immeuble */
.head{flex:none;display:grid;grid-template-columns:1fr 112px;margin:6px 6px 0;border:2px solid var(--line);border-bottom:0;background:var(--sheet)}
.head button{min-height:60px;padding:6px 10px;text-align:left}
.addr{font-size:21px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.code{border-left:2px solid var(--line)!important;font-size:21px;font-weight:700;overflow-wrap:anywhere;line-height:1.1}
.code small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.grid{flex:1 1 0;min-height:0;overflow-y:auto;margin:0 6px;display:flex;flex-direction:column;border:2px solid var(--line);border-bottom:0;background:var(--sheet);-webkit-overflow-scrolling:touch}
.floor{flex:1 0 88px;display:grid;grid-template-columns:50px 1fr;border-bottom:2px solid var(--line);max-height:132px}
.flabel{background:var(--floor);color:var(--floor-ink);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.flabel i{display:block;width:20px;height:20px;border:2px solid var(--floor-ink);border-radius:3px;font-style:normal;font-size:15px;line-height:16px;text-align:center}
.doors{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;min-width:0}
.door{display:grid;grid-template-columns:24px 1fr 1fr;min-width:0;border-bottom:1px solid var(--line);border-left:2px solid var(--line)}
.door:first-child,.door:nth-child(4){border-left:0}
.door:nth-child(n+4){border-bottom:0}
.num{display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
.c{border-left:1px solid var(--line);font-size:25px;font-weight:800;min-height:43px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.c.A{background:var(--a);color:var(--a-ink)}
.c.X{background:var(--x);color:var(--x-ink)}
.c.R{background:var(--r);color:var(--r-ink)}
.c.now{box-shadow:inset 0 0 0 3px var(--ink)}
.c:active{opacity:.7}
.offbox{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:17px;background:repeating-linear-gradient(135deg,transparent 0 9px,var(--raised) 9px 18px)}
.floor.off{flex:1 0 52px;max-height:88px}
.floormore{display:flex;gap:6px;padding:6px;flex:none}
.floormore .btn{min-height:44px;font-size:16px}
.notes{flex:none;margin:0 6px;border:2px solid var(--line);border-top:0;background:var(--sheet);min-height:40px;padding:6px 10px;text-align:left;width:calc(100% - 12px);font-size:17px;overflow-wrap:anywhere;white-space:pre-wrap}
.notes.empty{color:var(--mut)}
.legend{flex:none;display:flex;justify-content:space-between;gap:6px;padding:7px 8px 0;font-size:16px}
.legend span{display:flex;align-items:center;gap:6px}
.chip{display:inline-block;min-width:26px;padding:1px 6px;border-radius:4px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.chip.A{background:var(--a);color:var(--a-ink)}.chip.X{background:var(--x);color:var(--x-ink)}.chip.R{background:var(--r);color:var(--r-ink)}

/* Liste */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px 4px}
.top h1{flex:1;margin:0;font-size:24px;font-weight:800}
.top .icon{min-height:44px;padding:0 14px;border-radius:8px;background:var(--raised);font-weight:600}
.search{flex:none;padding:4px 8px 8px;position:relative}
input,textarea{width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--sheet);border:2px solid var(--line);border-radius:8px;padding:12px;-webkit-appearance:none;appearance:none}
.search button{position:absolute;right:12px;top:4px;height:52px;width:48px;font-size:24px;color:var(--mut)}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.street{position:sticky;top:0;background:var(--raised);padding:7px 12px;font-weight:700;font-size:18px;z-index:1}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:6px 12px;border-bottom:1px solid var(--line);text-align:left}
.row b{flex:1;font-size:23px;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.row .sum{display:flex;gap:5px;flex:none;font-size:17px}
.row em{font-style:normal;color:var(--mut);font-size:16px}
.note{margin:6px 8px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);font-size:16px}
.note button{display:block;margin-top:6px;font-weight:700;text-decoration:underline;min-height:32px}
.empty-msg{padding:32px 20px;text-align:center;color:var(--mut);font-size:18px}

/* Formulaires et menu */
.form{flex:1 1 0;min-height:0;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:600;color:var(--mut)}
.form textarea{min-height:88px;resize:none}
.err{color:var(--danger);font-weight:600}
.pair{display:grid;grid-template-columns:96px 1fr;gap:8px}
.foot2{flex:none;display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:8px}
.foot2 .btn.main{font-size:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font-size:18px}
.sec p{margin:0;color:var(--mut);font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg .on{background:var(--ink);color:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;padding:16px;z-index:5}
.dlg{background:var(--sheet);border:2px solid var(--line);border-radius:10px;padding:16px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:21px}.dlg p{margin:0}
.dlg div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;font-weight:600;z-index:6;text-align:center}
@media (prefers-reduced-motion:no-preference){.c{transition:opacity .08s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
const KEY='tournee-calendriers-v1', SESSION_MAX=12*3600*1000, DOORS=6, PASSES=2, BASE_FLOORS=6;
const NEXT={A:'X',X:'R',R:null};
const LABEL={A:'Absent',X:'Vente',R:'Refus'};
const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const standalone=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
const coll=new Intl.Collator('fr',{numeric:true,sensitivity:'base'});
const app=document.getElementById('app');
let storageOk=true, view={name:'list'}, query='', S;

function blank(){const y=new Date().getFullYear();return{v:1,seasons:[y],season:y,lastStreet:'',lastExport:0,lastChange:0,theme:'auto',open:null,buildings:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){storageOk=false}return blank()}
function save(changed=true){if(changed)S.lastChange=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false;toast("Enregistrement impossible sur ce téléphone. Faites une sauvegarde.")}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const floorName=i=>i===0?'RDC':i===1?'1er':i+'ème';
const newFloors=()=>Array.from({length:BASE_FLOORS},()=>({off:false}));
const latest=()=>Math.max(...S.seasons);
const readOnly=()=>S.season!==latest();
const byId=id=>S.buildings.find(b=>b.id===id);
const title=b=>(b.num?b.num+' ':'')+b.street;
const cells=b=>(b.visits&&b.visits[S.season])||{};
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

function summary(b){const c=cells(b),n={A:0,X:0,R:0};let any=false;
  b.floors.forEach((f,fi)=>{if(f.off)return;for(let d=0;d<DOORS;d++){const l=c[`${fi}-${d}-1`]||c[`${fi}-${d}-0`];if(l){n[l.s]++;any=true}}});return{n,any}}

/* ---------- Liste ---------- */
function renderList(){
  const notes=[];
  if(!storageOk)notes.push(`<div class="note">Ce téléphone refuse l'enregistrement : les saisies seront perdues à la fermeture.</div>`);
  if(framed)notes.push(`<div class="note">Aperçu avec des adresses d'exemple. L'application installée démarre vide et fonctionne hors connexion.</div>`);
  else if(!standalone)notes.push(`<div class="note">Installez l'application pour garder vos données : bouton Partager de Safari, puis « Sur l'écran d'accueil ». Ouvrez-la ensuite depuis son icône.</div>`);
  const week=7*864e5;
  if(S.buildings.length&&S.lastChange>S.lastExport&&Date.now()-S.lastExport>week)
    notes.push(`<div class="note">${S.lastExport?'Dernière sauvegarde le '+new Date(S.lastExport).toLocaleDateString('fr-FR'):'Aucune sauvegarde pour le moment'}.<button data-act="export">Sauvegarder maintenant</button></div>`);
  if(readOnly())notes.push(`<div class="note">Tournée ${S.season} en consultation.<button data-act="season" data-y="${latest()}">Revenir à ${latest()}</button></div>`);
  app.innerHTML=`<div class="top"><h1>Tournée ${S.season}</h1><button class="icon" data-act="menu">Réglages</button></div>
  <div class="search"><input id="q" type="search" placeholder="Rechercher une adresse" aria-label="Rechercher une adresse" autocomplete="off" autocorrect="off" enterkeyhint="search" value="${esc(query)}"><button data-act="clear" aria-label="Effacer la recherche" ${query?'':'hidden'}>×</button></div>
  <div class="scroll" id="results"></div>${notes.join('')}
  <div class="foot" ${readOnly()?'hidden':''}><button class="btn main" data-act="new">Nouvel immeuble</button></div>`;
  renderResults();
  document.getElementById('q').addEventListener('input',e=>{query=e.target.value;app.querySelector('[data-act=clear]').hidden=!query;renderResults()});
}
function renderResults(){
  const q=norm(query),el=document.getElementById('results');
  const list=S.buildings.filter(b=>norm(title(b)).includes(q)).sort((a,b)=>coll.compare(a.street,b.street)||coll.compare(a.num,b.num));
  if(!S.buildings.length){el.innerHTML=`<div class="empty-msg">Aucune adresse. Touchez « Nouvel immeuble » en arrivant au pied du premier immeuble.</div>`;return}
  if(!list.length){el.innerHTML=`<div class="empty-msg">Aucune adresse ne correspond à « ${esc(query)} ».</div>`;return}
  let html='',cur=null;
  for(const b of list){
    if(norm(b.street)!==cur){cur=norm(b.street);html+=`<div class="street">${esc(b.street)}</div>`}
    const {n,any}=summary(b);
    const sum=any?['X','A','R'].filter(k=>n[k]).map(k=>`<span class="chip ${k}" aria-label="${LABEL[k]} : ${n[k]}">${k} ${n[k]}</span>`).join(''):`<em>Pas encore visité</em>`;
    html+=`<button class="row" data-act="open" data-id="${b.id}"><b>${esc(b.num||'–')}</b><span class="sum">${sum}</span></button>`;
  }
  el.innerHTML=html;
}

/* ---------- Page immeuble ---------- */
function editable(c){return !readOnly()&&S.open&&c&&c.t>=S.open.start}
function cellHtml(b,fi,d,p){const c=cells(b)[`${fi}-${d}-${p}`];
  const cls=c?c.s+(editable(c)?' now':''):'';
  return `<button class="c ${cls}" data-f="${fi}" data-d="${d}" data-p="${p}" aria-label="${esc(floorName(fi))}, porte ${d+1}, passage ${p+1} : ${c?LABEL[c.s]:'vide'}">${c?c.s:''}</button>`}
function doorHtml(b,fi,n){let h=`<div class="door"><span class="num">${n+1}</span>`;for(let p=0;p<PASSES;p++)h+=cellHtml(b,fi,n,p);return h+'</div>'}
function hasData(b,fi){return Object.values(b.visits||{}).some(v=>Object.keys(v).some(k=>k.startsWith(fi+'-')))}
function renderBuilding(){
  const b=byId(view.id);if(!b){go('list');return}
  const order=[0,2,4,1,3,5];
  const floors=b.floors.map((f,fi)=>`<div class="floor ${f.off?'off':''}">
    <button class="flabel" data-act="floor" data-f="${fi}" aria-pressed="${f.off}" aria-label="${floorName(fi)} : ${f.off?'pas de porte, toucher pour rétablir':'toucher pour indiquer pas de porte'}">${floorName(fi)}<i>${f.off?'✕':''}</i></button>
    ${f.off?`<div class="offbox">Pas de porte</div>`:`<div class="doors">${order.map(n=>doorHtml(b,fi,n)).join('')}</div>`}</div>`).join('');
  const last=b.floors.length-1, canRemove=b.floors.length>BASE_FLOORS&&!hasData(b,last)&&!readOnly();
  app.innerHTML=`<div class="head"><button class="addr" data-act="edit" aria-label="Modifier l'adresse">${esc(title(b))}</button><button class="code" data-act="edit" aria-label="Modifier le code"><small>Code</small>${esc(b.code)}</button></div>
  <div class="grid" id="grid">${floors}${readOnly()?'':`<div class="floormore"><button class="btn" data-act="addfloor">Ajouter un étage</button>${canRemove?`<button class="btn" data-act="rmfloor">Retirer le ${floorName(last)}</button>`:''}</div>`}</div>
  <button class="notes ${b.notes?'':'empty'}" data-act="edit">${esc(b.notes||'Notes')}</button>
  <div class="legend"><span><i class="chip A" style="font-style:normal">A</i>Absent</span><span><i class="chip X" style="font-style:normal">X</i>Vente</span><span><i class="chip R" style="font-style:normal">R</i>Refus</span></div>
  <div class="foot"><button class="btn main" data-act="close">Fermer l'immeuble</button></div>`;
}
function tapCell(btn){
  const b=byId(view.id);if(!b)return;
  if(readOnly()){toast(`Tournée ${S.season} en consultation.`);return}
  const k=`${btn.dataset.f}-${btn.dataset.d}-${btn.dataset.p}`;
  b.visits=b.visits||{};const v=b.visits[S.season]=b.visits[S.season]||{};const c=v[k];
  if(!c)v[k]={s:'A',t:Date.now()};
  else if(!editable(c)){const d=new Date(c.t);toast(`${LABEL[c.s]} noté le ${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}. Appui long pour corriger.`);return}
  else{const n=NEXT[c.s];if(n){c.s=n;c.t=Date.now()}else delete v[k]}
  save();
  btn.outerHTML=cellHtml(b,+btn.dataset.f,+btn.dataset.d,+btn.dataset.p);
}
/* Appui long : rouvre une case d'un passage précédent */
let lpT=null,lpFired=false,lpX=0,lpY=0;
app.addEventListener('pointerdown',e=>{const t=e.target.closest('.c');lpFired=false;if(!t)return;lpX=e.clientX;lpY=e.clientY;
  lpT=setTimeout(()=>{lpT=null;const b=byId(view.id),k=`${t.dataset.f}-${t.dataset.d}-${t.dataset.p}`,c=b&&cells(b)[k];
    if(c&&!editable(c)&&!readOnly()&&S.open){lpFired=true;c.t=Date.now();save();t.outerHTML=cellHtml(b,+t.dataset.f,+t.dataset.d,+t.dataset.p);toast('Case rouverte : touchez-la pour la corriger.')}},650)});
const lpCancel=()=>{if(lpT){clearTimeout(lpT);lpT=null}};
app.addEventListener('pointerup',lpCancel);app.addEventListener('pointercancel',lpCancel);
app.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10))lpCancel()});
app.addEventListener('contextmenu',e=>{if(e.target.closest('.c'))e.preventDefault()});

/* ---------- Formulaire adresse ---------- */
function renderEdit(){
  const b=view.id?byId(view.id):null, streets=[...new Map(S.buildings.map(x=>[norm(x.street),x.street])).values()].sort(coll.compare);
  const street=b?b.street:S.lastStreet;
  app.innerHTML=`<div class="top"><h1>${b?"Modifier l'adresse":'Nouvel immeuble'}</h1></div>
  <div class="form">
    <div class="pair"><label>Numéro<input id="f-num" autocomplete="off" autocorrect="off" value="${esc(b?b.num:'')}"></label>
    <label>Rue<input id="f-street" list="streets" autocomplete="off" value="${esc(street)}"></label></div>
    <datalist id="streets">${streets.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <label>Code (digicode, interphone)<input id="f-code" autocomplete="off" autocorrect="off" value="${esc(b?b.code:'')}"></label>
    <label>Notes<textarea id="f-notes">${esc(b?b.notes:'')}</textarea></label>
    <div class="err" id="f-err" hidden></div>
    ${b&&!readOnly()?`<button class="btn danger" data-act="delete">Supprimer cette adresse</button>`:''}
  </div>
  <div class="foot2"><button class="btn" data-act="cancel">Annuler</button><button class="btn main" data-act="saveaddr">${b?'Enregistrer':'Créer la page'}</button></div>`;
  if(!b)document.getElementById('f-num').focus();
}
function saveAddr(){
  const val=id=>document.getElementById(id).value.trim();
  const num=val('f-num'),street=val('f-street'),code=val('f-code'),notes=val('f-notes'),err=document.getElementById('f-err');
  if(!street){err.textContent='Indiquez la rue.';err.hidden=false;return}
  const dup=S.buildings.find(x=>x.id!==view.id&&norm(x.num)===norm(num)&&norm(x.street)===norm(street));
  if(dup){err.innerHTML=`Cette adresse existe déjà.<button class="btn" style="margin-top:8px" data-act="open" data-id="${dup.id}">Ouvrir sa page</button>`;err.hidden=false;return}
  S.lastStreet=street;
  if(view.id){Object.assign(byId(view.id),{num,street,code,notes});save();go('building',view.id)}
  else{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    S.buildings.push({id,num,street,code,notes,floors:newFloors(),visits:{}});save();openBuilding(id)}
}

/* ---------- Réglages ---------- */
function renderMenu(){
  const y=latest()+1, seasons=[...S.seasons].sort((a,b)=>b-a);
  app.innerHTML=`<div class="top"><h1>Réglages</h1></div><div class="form">
  <div class="sec"><h2>Sauvegarde</h2><p>${S.lastExport?'Dernière sauvegarde le '+new Date(S.lastExport).toLocaleDateString('fr-FR'):'Aucune sauvegarde pour le moment'}. Enregistrez le fichier dans Fichiers ou iCloud Drive.</p>
    <button class="btn" data-act="export">Sauvegarder dans un fichier</button><button class="btn" data-act="import">Restaurer depuis un fichier</button></div>
  <div class="sec"><h2>Tournée</h2>
    ${seasons.length>1?`<div class="seg">${seasons.map(s=>`<button class="btn ${s===S.season?'on':''}" data-act="season" data-y="${s}">${s}</button>`).join('')}</div>`:''}
    <p>Garde les adresses, les codes, les notes et les étages. Les cases repartent vides, et les tournées passées restent consultables.</p>
    <button class="btn" data-act="newseason">Commencer la tournée ${y}</button></div>
  <div class="sec"><h2>Affichage</h2><div class="seg">${[['auto','Auto'],['dark','Sombre'],['light','Clair']].map(([k,l])=>`<button class="btn ${S.theme===k?'on':''}" data-act="theme" data-t="${k}">${l}</button>`).join('')}</div></div>
  </div><div class="foot"><button class="btn main" data-act="back">Retour à la liste</button></div>`;
}
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function dialog(t,msg,ok,fn){const d=document.createElement('div');d.className='scrim';
  d.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true"><h2>${esc(t)}</h2><p>${esc(msg)}</p><div><button class="btn" id="dNo">Annuler</button><button class="btn main" style="font-size:17px" id="dOk">${esc(ok)}</button></div></div>`;
  document.body.appendChild(d);d.querySelector('#dNo').onclick=()=>d.remove();d.querySelector('#dOk').onclick=()=>{d.remove();fn()}}
async function exportData(){
  const stamp=new Date().toISOString().slice(0,10),name=`tournee-${stamp}.json`,data={...S,open:null};
  const file=new File([JSON.stringify(data,null,1)],name,{type:'application/json'});
  const done=()=>{S.lastExport=Date.now();save(false);render();toast('Sauvegarde créée.')};
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done();return} }
  catch(e){ if(e.name==='AbortError'){toast('Sauvegarde annulée.');return} }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);done();
}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.buildings)||!Array.isArray(d.seasons))throw 0;
    dialog('Restaurer cette sauvegarde ?',`${d.buildings.length} adresses. Les données actuelles seront remplacées.`,'Restaurer',()=>{S=Object.assign(blank(),d,{open:null,theme:S.theme});save(false);go('list');toast('Sauvegarde restaurée.')})
  }catch(_){toast("Ce fichier n'est pas une sauvegarde de l'application.")}});

/* ---------- Navigation ---------- */
function render(){({list:renderList,building:renderBuilding,edit:renderEdit,menu:renderMenu})[view.name]()}
function go(name,id){view={name,id};render()}
function openBuilding(id){if(!readOnly()){S.open={id,start:Date.now()};save(false)}go('building',id)}
document.addEventListener('click',e=>{
  const cell=e.target.closest('.c');
  if(cell){if(lpFired){lpFired=false;return}tapCell(cell);return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,b=view.id&&byId(view.id);
  if(a==='new')go('edit');
  else if(a==='menu')go('menu');
  else if(a==='back')go('list');
  else if(a==='clear'){query='';render()}
  else if(a==='open')openBuilding(t.dataset.id);
  else if(a==='close'){S.open=null;save(false);go('list')}
  else if(a==='edit')go('edit',view.id);
  else if(a==='cancel'){view.id?go('building',view.id):go('list')}
  else if(a==='saveaddr')saveAddr();
  else if(a==='floor'){if(readOnly())return;const f=b.floors[+t.dataset.f];f.off=!f.off;save();const y=document.getElementById('grid').scrollTop;render();document.getElementById('grid').scrollTop=y}
  else if(a==='addfloor'){b.floors.push({off:false});save();render();const g=document.getElementById('grid');g.scrollTop=g.scrollHeight}
  else if(a==='rmfloor'){b.floors.pop();save();render()}
  else if(a==='delete')dialog('Supprimer cette adresse ?',`${title(b)} et tous ses passages seront effacés, y compris ceux des années précédentes.`,'Supprimer',()=>{S.buildings=S.buildings.filter(x=>x.id!==b.id);S.open=null;save();go('list');toast('Adresse supprimée.')});
  else if(a==='export')exportData();
  else if(a==='import')document.getElementById('importFile').click();
  else if(a==='season'){S.season=+t.dataset.y;S.open=null;save(false);go('list')}
  else if(a==='newseason'){const y=latest()+1;dialog(`Commencer la tournée ${y} ?`,'Les adresses et les étages sont repris, les cases repartent vides. La tournée précédente reste consultable.','Commencer',()=>{S.seasons.push(y);S.season=y;S.open=null;save();go('list');toast(`Tournée ${y} commencée.`)})}
  else if(a==='theme'){S.theme=t.dataset.t;save(false);applyTheme();render()}
});

/* ---------- Démarrage ---------- */
S=load();
if(framed&&!S.buildings.length){const y=S.season,mk=(num,street,code,notes,cs,off)=>{const fl=newFloors();(off||[]).forEach(i=>fl[i].off=true);return{id:'ex'+num+street.length,num,street,code,notes,floors:fl,visits:{[y]:cs}}},old=1;
  S.buildings=[mk('12','Rue des Exemples','47B21','Interphone : Martin',{'0-0-0':{s:'A',t:old},'0-0-1':{s:'X',t:old},'0-1-0':{s:'X',t:old},'1-0-0':{s:'R',t:old},'1-2-0':{s:'A',t:old},'2-3-0':{s:'A',t:old},'3-0-0':{s:'X',t:old}},[5]),mk('14 bis','Rue des Exemples','','',{'0-0-0':{s:'X',t:old}}),mk('3','Avenue de la Démo','1985','',{})]}
applyTheme();
if(S.open&&byId(S.open.id)&&Date.now()-S.open.start<SESSION_MAX&&!readOnly())view={name:'building',id:S.open.id};
else if(S.open){S.open=null;save(false)}
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&!framed)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
