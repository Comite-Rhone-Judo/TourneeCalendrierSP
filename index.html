<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet de tournée</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tournée">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Concept : la page du carnet papier, plein écran, lisible de nuit. Thème sombre d'abord. */
:root{--bg:#000;--sheet:#15171a;--raised:#262a2f;--line:#5a606a;--ink:#fff;--mut:#bcc2ca;--floor:#6b7079;--floor-ink:#fff;
--x:#2fd36f;--x-ink:#00210d;--a:#ffcf33;--a-ink:#000;--r:#ff5b50;--r-ink:#000;--danger:#ff7a70;--warn-bg:#3a2f00;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ebee;--sheet:#fff;--raised:#dcdfe3;--line:#2b2e33;--ink:#000;--mut:#454a51;--floor:#646971;--floor-ink:#fff;
--x:#0d8a40;--x-ink:#fff;--a:#ffc400;--a-ink:#000;--r:#d3261c;--r-ink:#fff;--danger:#b81f16;--warn-bg:#fff0b8;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9ebee;--sheet:#fff;--raised:#dcdfe3;--line:#2b2e33;--ink:#000;--mut:#454a51;--floor:#646971;--floor-ink:#fff;
--x:#0d8a40;--x-ink:#fff;--a:#ffc400;--a-ink:#000;--r:#d3261c;--r-ink:#fff;--danger:#b81f16;--warn-bg:#fff0b8;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px/1.3 var(--font);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
.btn{min-height:54px;padding:0 16px;border-radius:8px;background:var(--raised);font-weight:600;text-align:center;width:100%}
.btn.main{background:var(--ink);color:var(--bg);font-size:20px;font-weight:700}
.btn.danger{color:var(--danger);background:none;border:2px solid var(--danger)}
.foot{flex:none;padding:8px 8px}

/* Page immeuble */
.head{flex:none;display:grid;grid-template-columns:1fr 112px;margin:6px 6px 0;border:2px solid var(--line);border-bottom:0;background:var(--sheet)}
.head button{min-height:54px;padding:6px 10px;text-align:left}
.addr{font-size:21px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.code{border-left:2px solid var(--line)!important;font-size:21px;font-weight:700;overflow-wrap:anywhere;line-height:1.1}
.code small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.grid{flex:1 1 0;min-height:0;overflow-y:auto;margin:0 6px;display:flex;flex-direction:column;border:2px solid var(--line);border-bottom:0;background:var(--sheet);-webkit-overflow-scrolling:touch}
.floor{flex:1 0 83px;display:grid;grid-template-columns:50px 1fr;border-bottom:2px solid var(--line);max-height:132px}
.flabel{background:var(--floor);color:var(--floor-ink);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.flabel i{display:block;width:20px;height:20px;border:2px solid var(--floor-ink);border-radius:3px;font-style:normal;font-size:15px;line-height:16px;text-align:center}
.doors{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;min-width:0}
.door{display:grid;grid-template-columns:24px 1fr 1fr;min-width:0;border-bottom:1px solid var(--line);border-left:2px solid var(--line)}
.door:first-child,.door:nth-child(4){border-left:0}
.door:nth-child(n+4){border-bottom:0}
.num{display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
.c{border-left:1px solid var(--line);font-size:25px;font-weight:800;min-height:40px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.c.A{background:var(--a);color:var(--a-ink)}
.c.X{background:var(--x);color:var(--x-ink)}
.c.R{background:var(--r);color:var(--r-ink)}
.c.now{box-shadow:inset 0 0 0 3px var(--ink)}
.c:active{opacity:.7}
.offbox{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:17px;background:repeating-linear-gradient(135deg,transparent 0 9px,var(--raised) 9px 18px)}
.floor.off{flex:1 0 52px;max-height:88px}
.floormore{display:flex;flex-wrap:wrap;gap:6px;padding:6px;flex:none}
.floormore .btn{flex:1 1 40%;width:auto;min-height:44px;padding:0 6px;font-size:16px}
.notes{flex:none;margin:0 6px;border:2px solid var(--line);border-top:0;background:var(--sheet);min-height:40px;padding:6px 10px;text-align:left;width:calc(100% - 12px);font-size:17px;overflow-wrap:anywhere;white-space:pre-wrap}
.notes.empty{color:var(--mut)}
.legend{flex:none;display:flex;justify-content:space-between;gap:6px;padding:7px 8px 0;font-size:16px}
.legend span{display:flex;align-items:center;gap:6px}
.chip{display:inline-block;min-width:26px;padding:1px 6px;border-radius:4px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.chip.A{background:var(--a);color:var(--a-ink)}.chip.X{background:var(--x);color:var(--x-ink)}.chip.R{background:var(--r);color:var(--r-ink)}

/* Liste */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px 4px}
.top h1{flex:1;margin:0;font-size:24px;font-weight:800}
.top .icon{min-height:44px;padding:0 14px;border-radius:8px;background:var(--raised);font-weight:600}
.search{flex:none;padding:4px 8px 8px;position:relative}
input,textarea{width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--sheet);border:2px solid var(--line);border-radius:8px;padding:12px;-webkit-appearance:none;appearance:none}
.search button{position:absolute;right:12px;top:4px;height:52px;width:48px;font-size:24px;color:var(--mut)}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.street{position:sticky;top:0;background:var(--raised);padding:7px 12px;font-weight:700;font-size:18px;z-index:1}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:6px 12px;border-bottom:1px solid var(--line);text-align:left}
.row b{flex:1;font-size:23px;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.row .sum{display:flex;gap:5px;flex:none;font-size:17px}
.row em{font-style:normal;color:var(--mut);font-size:16px}
.note{margin:6px 8px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);font-size:16px}
.note button{display:block;margin-top:6px;font-weight:700;text-decoration:underline;min-height:32px}
.empty-msg{padding:32px 20px;text-align:center;color:var(--mut);font-size:18px}

/* Formulaires et menu */
.form{flex:1 1 0;min-height:0;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:600;color:var(--mut)}
.form textarea{min-height:88px;resize:none}
.err{color:var(--danger);font-weight:600}
.pair{display:grid;grid-template-columns:96px 1fr;gap:8px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types .btn{min-height:44px;padding:0 2px;font-size:15px;width:auto}
.types .on{background:var(--ink);color:var(--bg)}
.preview{font-size:21px;font-weight:700;min-height:27px}
.clearable{position:relative;display:block}
.clearable input{padding-right:40px}
.clearable button{position:absolute;right:0;top:0;bottom:0;width:42px;font-size:24px;color:var(--mut)}
.mapwrap{flex:1 1 0;min-height:0;position:relative}
#map{position:absolute;inset:0;background:#dfe3e8}
.mapmsg{flex:none;padding:6px 12px;font-size:16px;color:var(--mut)}
.mapmsg:empty{display:none}
.pin{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;padding:3px 7px;border-radius:6px;font:800 15px/1.2 var(--font);border:2px solid #000;background:#d5d9de;color:#000}
.pin.a{background:#ffcf33}.pin.d{background:#2fd36f}.pin.approx{border-style:dashed}
.pinicon{background:none;border:0}
.pop{display:flex;flex-direction:column;gap:8px;min-width:190px;font:16px var(--font);color:#000}
.pop b{font-size:18px}.pop .sum{display:flex;gap:5px}
.pop button{min-height:44px;border-radius:8px;background:#000;color:#fff;font-weight:700}
.dot{display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid #000}
.dot.n{background:#d5d9de}.dot.a{background:#ffcf33}.dot.d{background:#2fd36f}
.syncline{flex:none;padding:4px 12px;font-size:15px;color:var(--mut)}
.syncline.bad{color:var(--danger);font-weight:600}
.msgline{font-weight:600;font-size:16px}
.foot2{flex:none;display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:8px}
.foot2 .btn.main{font-size:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font-size:18px}
.sec p{margin:0;color:var(--mut);font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg .on{background:var(--ink);color:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;padding:16px;z-index:5}
.dlg{background:var(--sheet);border:2px solid var(--line);border-radius:10px;padding:16px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:21px}.dlg p{margin:0}
.dlg div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;font-weight:600;z-index:6;text-align:center}
@media (prefers-reduced-motion:no-preference){.c{transition:opacity .08s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" hidden></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
const KEY='tournee-calendriers-v1', SESSION_MAX=12*3600*1000, DOORS=6, PASSES=2, BASE_FLOORS=6;
const NEXT={A:'X',X:'R',R:null};
const LABEL={A:'Absent',X:'Vente',R:'Refus'};
const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const standalone=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
const coll=new Intl.Collator('fr',{numeric:true,sensitivity:'base'});
const app=document.getElementById('app');
let storageOk=true, view={name:'list'}, query='', S;

const TYPES=['rue','avenue','boulevard','allée','place','impasse','chemin',''];
const fullStreet=(t,n)=>(t?t+' ':'')+n;
function parseStreet(s){const m=String(s||'').trim().match(/^(rue|avenue|av\.?|boulevard|bd|all[ée]e|place|impasse|chemin)\s+(.+)$/i);
  if(!m)return{stype:'',sname:String(s||'').trim()};
  const k=norm(m[1]);return{stype:k.startsWith('av')?'avenue':k==='bd'?'boulevard':k==='allee'?'allée':k,sname:m[2]}}
function migrate(d){(d.buildings||[]).forEach(b=>{if(b.sname===undefined){Object.assign(b,parseStreet(b.street))}b.street=fullStreet(b.stype,b.sname)});
  if(!d.v2){const p=parseStreet(d.lastStreet);d.lastStreet=p.sname;d.lastType=p.stype||'rue';d.v2=1}return d}
function levenshtein(a,b){let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
const normNum=s=>norm(s).replace(/\s/g,'');
/* Copie de secours dans IndexedDB, relue si le stockage principal revient vide */
function idb(mode,fn){return new Promise((ok,ko)=>{const r=indexedDB.open('tournee',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>ko(r.error);
  r.onsuccess=()=>{const t=r.result.transaction('kv',mode),q=fn(t.objectStore('kv'));t.oncomplete=()=>{r.result.close();ok(q.result)};t.onerror=()=>ko(t.error)}})}
const mirror=j=>{try{idb('readwrite',s=>s.put(j,'data')).catch(()=>{})}catch(e){}};
function blank(){const y=new Date().getFullYear();return{v:1,seasons:[y],season:y,lastStreet:'',lastType:'rue',city:'',postcode:'',lastExport:0,lastChange:0,theme:'auto',open:null,buildings:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(Object.assign(blank(),JSON.parse(r)))}catch(e){storageOk=false}return blank()}
function save(changed=true){if(changed)S.lastChange=Date.now();if(changed)scheduleSync();const j=JSON.stringify(S);mirror(j);try{localStorage.setItem(KEY,j);storageOk=true}catch(e){storageOk=false;toast("Enregistrement impossible sur ce téléphone. Faites une sauvegarde.")}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const floorName=i=>i===0?'RDC':i===1?'1er':i+'ème';
const newFloors=()=>Array.from({length:BASE_FLOORS},()=>({off:false}));
const latest=()=>Math.max(...S.seasons);
const readOnly=()=>S.season!==latest();
const byId=id=>S.buildings.find(b=>b.id===id);
const title=b=>(b.num?b.num+' ':'')+b.street;
const cells=b=>(b.visits&&b.visits[S.season])||{};
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

function summary(b){const c=cells(b),n={A:0,X:0,R:0};let any=false;
  b.floors.forEach((f,fi)=>{if(f.off)return;for(let d=0;d<DOORS;d++){const l=c[`${fi}-${d}-1`]||c[`${fi}-${d}-0`];if(l){n[l.s]++;any=true}}});return{n,any}}

/* ---------- Liste ---------- */
function renderList(){
  const notes=[];
  if(!storageOk)notes.push(`<div class="note">Ce téléphone refuse l'enregistrement : les saisies seront perdues à la fermeture.</div>`);
  if(framed)notes.push(`<div class="note">Aperçu avec des adresses d'exemple. L'application installée démarre vide et fonctionne hors connexion.</div>`);
  else if(!standalone)notes.push(`<div class="note">Installez l'application pour garder vos données : bouton Partager de Safari, puis « Sur l'écran d'accueil ». Ouvrez-la ensuite depuis son icône.</div>`);
  const day=864e5;
  if(S.buildings.length&&!(sync.repo&&!sync.error)&&S.lastChange>S.lastExport&&Date.now()-S.lastExport>day)
    notes.push(`<div class="note">${S.lastExport?'Dernière sauvegarde le '+new Date(S.lastExport).toLocaleDateString('fr-FR'):'Aucune sauvegarde pour le moment'}.<button data-act="export">Sauvegarder maintenant</button></div>`);
  if(readOnly())notes.push(`<div class="note">Tournée ${S.season} en consultation.<button data-act="season" data-y="${latest()}">Revenir à ${latest()}</button></div>`);
  app.innerHTML=`<div class="top"><h1>Tournée ${S.season}</h1>${framed?'':'<button class="icon" data-act="map">Carte</button>'}<button class="icon" data-act="menu">Réglages</button></div>
  <div class="search"><input id="q" type="search" placeholder="Rechercher une adresse" aria-label="Rechercher une adresse" autocomplete="off" autocorrect="off" enterkeyhint="search" value="${esc(query)}"><button data-act="clear" aria-label="Effacer la recherche" ${query?'':'hidden'}>×</button></div>
  <div class="scroll" id="results"></div>${notes.join('')}<div class="syncline" id="syncline" hidden></div>
  <div class="foot" ${readOnly()?'hidden':''}><button class="btn main" data-act="new">Nouvel immeuble</button></div>`;
  renderResults();updateSyncLine();
  document.getElementById('q').addEventListener('input',e=>{query=e.target.value;app.querySelector('[data-act=clear]').hidden=!query;renderResults()});
}
function renderResults(){
  const q=norm(query),el=document.getElementById('results');
  const list=S.buildings.filter(b=>norm(title(b)).includes(q)).sort((a,b)=>coll.compare(a.sname,b.sname)||coll.compare(a.stype,b.stype)||coll.compare(a.num,b.num));
  if(!S.buildings.length){el.innerHTML=`<div class="empty-msg">Aucune adresse. Touchez « Nouvel immeuble » en arrivant au pied du premier immeuble.</div>`;return}
  if(!list.length){el.innerHTML=`<div class="empty-msg">Aucune adresse ne correspond à « ${esc(query)} ».</div>`;return}
  let html='',cur=null;
  for(const b of list){
    if(norm(b.street)!==cur){cur=norm(b.street);html+=`<div class="street">${esc(b.street)}</div>`}
    const {n,any}=summary(b);
    const sum=any?['X','A','R'].filter(k=>n[k]).map(k=>`<span class="chip ${k}" aria-label="${LABEL[k]} : ${n[k]}">${k} ${n[k]}</span>`).join(''):`<em>Pas encore visité</em>`;
    html+=`<button class="row" data-act="open" data-id="${b.id}"><b>${esc(b.num||'–')}</b><span class="sum">${sum}</span></button>`;
  }
  el.innerHTML=html;
}

/* ---------- Page immeuble ---------- */
function editable(c){return !readOnly()&&S.open&&c&&c.t>=S.open.start}
function cellHtml(b,fi,d,p){const c=cells(b)[`${fi}-${d}-${p}`];
  const cls=c?c.s+(editable(c)?' now':''):'';
  return `<button class="c ${cls}" data-f="${fi}" data-d="${d}" data-p="${p}" aria-label="${esc(floorName(fi))}, porte ${d+1}, passage ${p+1} : ${c?LABEL[c.s]:'vide'}">${c?c.s:''}</button>`}
function doorHtml(b,fi,n){let h=`<div class="door"><span class="num">${n+1}</span>`;for(let p=0;p<PASSES;p++)h+=cellHtml(b,fi,n,p);return h+'</div>'}
function hasData(b,fi){return Object.values(b.visits||{}).some(v=>Object.keys(v).some(k=>k.startsWith(fi+'-')))}
function renderBuilding(){
  const b=byId(view.id);if(!b){go('list');return}
  const order=[0,2,4,1,3,5];
  const floors=b.floors.map((f,fi)=>`<div class="floor ${f.off?'off':''}">
    <button class="flabel" data-act="floor" data-f="${fi}" aria-pressed="${f.off}" aria-label="${floorName(fi)} : ${f.off?'pas de porte, toucher pour rétablir':'toucher pour indiquer pas de porte'}">${floorName(fi)}<i>${f.off?'✕':''}</i></button>
    ${f.off?`<div class="offbox">Pas de porte</div>`:`<div class="doors">${order.map(n=>doorHtml(b,fi,n)).join('')}</div>`}</div>`).join('');
  const last=b.floors.length-1, canRemove=b.floors.length>BASE_FLOORS&&!hasData(b,last)&&!readOnly();
  app.innerHTML=`<div class="head"><button class="addr" data-act="edit" aria-label="Modifier l'adresse">${esc(title(b))}</button><button class="code" data-act="edit" aria-label="Modifier le code"><small>Code</small>${esc(b.code)}</button></div>
  <div class="grid" id="grid">${floors}${readOnly()?'':`<div class="floormore"><button class="btn" data-act="addfloor">Ajouter un étage</button><button class="btn" data-act="edit">Modifier ou supprimer</button>${canRemove?`<button class="btn" data-act="rmfloor">Retirer le ${floorName(last)}</button>`:''}</div>`}</div>
  <button class="notes ${b.notes?'':'empty'}" data-act="edit">${esc(b.notes||'Notes')}</button>
  <div class="legend"><span><i class="chip A" style="font-style:normal">A</i>Absent</span><span><i class="chip X" style="font-style:normal">X</i>Vente</span><span><i class="chip R" style="font-style:normal">R</i>Refus</span></div>
  <div class="foot"><button class="btn main" data-act="close">Fermer l'immeuble</button></div>`;
}
function tapCell(btn){
  const b=byId(view.id);if(!b)return;
  if(readOnly()){toast(`Tournée ${S.season} en consultation.`);return}
  const k=`${btn.dataset.f}-${btn.dataset.d}-${btn.dataset.p}`;
  b.visits=b.visits||{};const v=b.visits[S.season]=b.visits[S.season]||{};const c=v[k];
  if(!c)v[k]={s:'A',t:Date.now()};
  else if(!editable(c)){const d=new Date(c.t);toast(`${LABEL[c.s]} noté le ${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}. Appui long pour corriger.`);return}
  else{const n=NEXT[c.s];if(n){c.s=n;c.t=Date.now()}else delete v[k]}
  save();
  btn.outerHTML=cellHtml(b,+btn.dataset.f,+btn.dataset.d,+btn.dataset.p);
}
/* Appui long : rouvre une case d'un passage précédent */
let lpT=null,lpFired=false,lpX=0,lpY=0;
app.addEventListener('pointerdown',e=>{const t=e.target.closest('.c');lpFired=false;if(!t)return;lpX=e.clientX;lpY=e.clientY;
  lpT=setTimeout(()=>{lpT=null;const b=byId(view.id),k=`${t.dataset.f}-${t.dataset.d}-${t.dataset.p}`,c=b&&cells(b)[k];
    if(c&&!editable(c)&&!readOnly()&&S.open){lpFired=true;c.t=Date.now();save();t.outerHTML=cellHtml(b,+t.dataset.f,+t.dataset.d,+t.dataset.p);toast('Case rouverte : touchez-la pour la corriger.')}},650)});
const lpCancel=()=>{if(lpT){clearTimeout(lpT);lpT=null}};
app.addEventListener('pointerup',lpCancel);app.addEventListener('pointercancel',lpCancel);
app.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10))lpCancel()});
app.addEventListener('contextmenu',e=>{if(e.target.closest('.c'))e.preventDefault()});

let formType='rue';
function renderEdit(){
  const b=view.id?byId(view.id):null, names=[...new Map(S.buildings.map(x=>[norm(x.sname),x.sname])).values()].sort(coll.compare);
  formType=b?b.stype:(S.lastType??'rue');
  app.innerHTML=`<div class="top"><h1>${b?"Modifier l'adresse":'Nouvel immeuble'}</h1></div>
  <div class="form">
    <div class="pair"><label>Numéro<input id="f-num" autocomplete="off" autocorrect="off" value="${esc(b?b.num:'')}"></label>
    <label>Nom de la voie<span class="clearable"><input id="f-street" list="streets" autocomplete="off" autocapitalize="words" value="${esc(b?b.sname:S.lastStreet)}"><button type="button" data-act="clearname" aria-label="Effacer le nom">×</button></span></label></div>
    <datalist id="streets">${names.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <div class="types" id="types">${TYPES.map(t=>`<button type="button" class="btn ${t===formType?'on':''}" data-act="stype" data-t="${esc(t)}">${t?t[0].toUpperCase()+t.slice(1):'Autre'}</button>`).join('')}</div>
    <div class="preview" id="f-prev"></div>
    <label>Code (digicode, interphone)<input id="f-code" autocomplete="off" autocorrect="off" value="${esc(b?b.code:'')}"></label>
    <label>Notes<textarea id="f-notes">${esc(b?b.notes:'')}</textarea></label>
    <div class="err" id="f-err" hidden></div>
    ${b&&!readOnly()?`<button class="btn danger" data-act="delete">Supprimer cette adresse</button>`:''}
  </div>
  <div class="foot2"><button class="btn" data-act="cancel">Annuler</button><button class="btn main" data-act="saveaddr">${b?'Enregistrer':'Créer la page'}</button></div>`;
  const nm=document.getElementById('f-street'),num=document.getElementById('f-num');
  const prev=()=>{document.getElementById('f-prev').textContent=fullStreet(formType,nm.value.trim())?(num.value.trim()+' '+fullStreet(formType,nm.value.trim())).trim():'';document.getElementById('f-err').hidden=true};
  nm.addEventListener('focus',()=>nm.select());
  nm.addEventListener('input',()=>{const hit=S.buildings.find(x=>norm(x.sname)===norm(nm.value));if(hit)setType(hit.stype);prev()});
  num.addEventListener('input',prev);prev();
  if(!b)num.focus();
}
function setType(t){formType=t;document.querySelectorAll('#types .btn').forEach(x=>x.classList.toggle('on',x.dataset.t===t));const n=document.getElementById('f-street').value.trim(),m=document.getElementById('f-num').value.trim();document.getElementById('f-prev').textContent=(m+' '+fullStreet(t,n)).trim()}
function saveAddr(force){
  const val=id=>document.getElementById(id).value.trim();
  const num=val('f-num'),sname=val('f-street'),code=val('f-code'),notes=val('f-notes'),err=document.getElementById('f-err'),street=fullStreet(formType,sname);
  if(!sname){err.textContent='Indiquez le nom de la voie.';err.hidden=false;return}
  const dup=S.buildings.find(x=>x.id!==view.id&&normNum(x.num)===normNum(num)&&norm(x.street)===norm(street));
  if(dup){err.innerHTML=`Le ${esc(title(dup))} existe déjà.<button class="btn" style="margin-top:8px" data-act="open" data-id="${dup.id}">Ouvrir sa page</button>`;err.hidden=false;err.scrollIntoView();return}
  if(!force){const n=norm(sname),others=S.buildings.filter(x=>x.id!==view.id);
    if(!others.some(x=>norm(x.sname)===n)){
      const near=others.find(x=>{const m=norm(x.sname);return n.length>=4&&levenshtein(n,m)<=(n.length<8?1:2)});
      if(near){err.innerHTML=`Vouliez-vous dire « ${esc(near.street)} » ?<button class="btn" style="margin-top:8px" data-act="usename" data-id="${near.id}">Oui, corriger</button><button class="btn" style="margin-top:8px" data-act="force">Non, garder « ${esc(street)} »</button>`;err.hidden=false;err.scrollIntoView();return}}}
  S.lastStreet=sname;S.lastType=formType;
  if(view.id){Object.assign(byId(view.id),{num,street,stype:formType,sname,code,notes});save();go('building',view.id)}
  else{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    S.buildings.push({id,num,street,stype:formType,sname,code,notes,floors:newFloors(),visits:{}});save();openBuilding(id)}
}

/* ---------- Sauvegarde GitHub ---------- */
const SYNC_KEY='tournee-sync',GH='https://api.github.com/repos/',GH_FILE='tournee.json';
function loadSync(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return{}}}
let sync=loadSync(),pushing=false,syncT=null;
function saveSync(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(sync))}catch(e){}}
const ghHead=(tok,raw)=>({Authorization:'Bearer '+tok,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
function toB64(s){const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
const ghError=c=>c===401?'jeton refusé ou expiré':c===403?'le jeton n\'a pas le droit d\'écrire (Contents : Read and write)':c===404?'dépôt introuvable avec ce jeton':'erreur GitHub '+c;
const fileUrl=()=>GH+sync.repo+'/contents/'+GH_FILE;
async function ghSha(){const r=await fetch(fileUrl(),{headers:ghHead(sync.token),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw{code:r.status};return(await r.json()).sha}
const isDirty=()=>!!sync.repo&&!!S.buildings.length&&S.lastChange>(sync.lastPush||0);
function scheduleSync(){if(!sync.repo)return;updateSyncLine();clearTimeout(syncT);syncT=setTimeout(pushNow,15000)}
async function pushNow(force){
  if(!sync.repo||pushing||!S.buildings.length||(!force&&!isDirty()))return;
  if(navigator.onLine===false){updateSyncLine();return}
  clearTimeout(syncT);pushing=true;const stamp=S.lastChange;
  const body=JSON.stringify({...S,open:null},null,1);
  try{
    for(let tryNo=0;tryNo<2;tryNo++){
      if(!sync.sha)sync.sha=await ghSha();
      const r=await fetch(fileUrl(),{method:'PUT',headers:ghHead(sync.token),body:JSON.stringify({message:'Sauvegarde automatique',content:toB64(body),...(sync.sha?{sha:sync.sha}:{})})});
      if(r.ok){sync.sha=(await r.json()).content.sha;sync.lastPush=Math.max(stamp,1);sync.lastOk=Date.now();sync.error='';break}
      if((r.status===409||r.status===422)&&tryNo===0){sync.sha=null;continue}
      throw{code:r.status};
    }
  }catch(e){if(e&&e.code)sync.error=ghError(e.code)}
  pushing=false;saveSync();updateSyncLine();
  if(view.name==='list'&&!sync.error)return;
}
function syncText(){if(!sync.repo)return null;
  if(sync.error)return{bad:true,t:'Sauvegarde GitHub en échec : '+sync.error+'.'};
  if(isDirty())return{t:'Sauvegarde GitHub en attente de réseau.'};
  if(sync.lastOk){const d=new Date(sync.lastOk),same=d.toDateString()===new Date().toDateString();return{t:'Sauvegardé sur GitHub '+(same?'à ':'le '+d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' à ')+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'.'}}
  return{t:'Sauvegarde GitHub activée.'}}
function updateSyncLine(){const v=syncText();for(const id of['syncline','sync-msg']){const l=document.getElementById(id);if(!l)continue;if(!v){l.hidden=true;continue}l.hidden=false;l.textContent=v.t;l.classList.toggle('bad',!!v.bad)}}
async function activateSync(){
  const repo=document.getElementById('s-repo').value.trim().replace(/^https:\/\/github\.com\//,'').replace(/\/$/,''),token=document.getElementById('s-token').value.trim(),m=document.getElementById('sync-msg');
  const fail=t=>{m.textContent=t;m.classList.add('bad')};
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){fail('Indiquez le dépôt sous la forme compte/nom.');return}
  if(!token){fail('Collez le jeton d\'accès.');return}
  m.classList.remove('bad');m.textContent='Vérification…';
  try{
    const r=await fetch(GH+repo,{headers:ghHead(token),cache:'no-store'});
    if(!r.ok){fail('Activation impossible : '+ghError(r.status)+'.');return}
    if(!(await r.json()).private){fail('Ce dépôt est public : vos adresses et vos codes y seraient visibles. Choisissez un dépôt privé.');return}
    sync={repo,token};sync.sha=await ghSha();saveSync();
    if(sync.sha&&!S.buildings.length){render();restoreSync();return}
    render();await pushNow(true);
  }catch(e){if(e&&e.code)fail('Activation impossible : '+ghError(e.code)+'.');else fail('GitHub est injoignable. Vérifiez le réseau.')}
}
function restoreSync(){dialog('Récupérer la sauvegarde GitHub ?','Les données de ce téléphone seront remplacées par la dernière sauvegarde envoyée.','Récupérer',async()=>{
  try{const r=await fetch(fileUrl(),{headers:ghHead(sync.token,true),cache:'no-store'});if(!r.ok)throw{code:r.status};
    const d=JSON.parse(await r.text());if(!Array.isArray(d.buildings))throw{};
    S=migrate(Object.assign(blank(),d,{open:null,theme:S.theme}));save(false);sync.lastPush=S.lastChange;sync.error='';saveSync();go('list');toast(`${S.buildings.length} adresses récupérées.`)
  }catch(e){toast(e&&e.code?'Récupération impossible : '+ghError(e.code)+'.':'Récupération impossible. Vérifiez le réseau.')}})}

/* ---------- Carte ---------- */
let mapObj=null,mapToken=0;
function loadLeaflet(){if(window.L)return Promise.resolve();return new Promise((ok,ko)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='leaflet.css';document.head.appendChild(c);const s=document.createElement('script');s.src='leaflet.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
const geoQuery=b=>`${b.num} ${b.street} ${S.postcode} ${S.city}`.replace(/\s+/g,' ').trim();
function mapState(b){const c=cells(b);let any=false,todo=false;b.floors.forEach((f,fi)=>{if(f.off)return;for(let d=0;d<DOORS;d++){const a=c[`${fi}-${d}-0`],z=c[`${fi}-${d}-1`];if(a||z)any=true;if(a&&a.s==='A'&&!z)todo=true}});return todo?'a':any?'d':'n'}
function addPin(b,layer){const g=b.geo;
  const m=L.marker([g.lat,g.lon],{icon:L.divIcon({className:'pinicon',iconSize:[0,0],html:`<span class="pin ${mapState(b)==='n'?'':mapState(b)} ${g.approx?'approx':''}">${esc(b.num||'•')}</span>`})}).addTo(layer);
  const {n,any}=summary(b);
  m.bindPopup(`<div class="pop"><b>${esc(title(b))}</b><div class="sum">${any?['X','A','R'].filter(k=>n[k]).map(k=>`<span class="chip ${k}">${k} ${n[k]}</span>`).join(''):'Pas encore visité'}</div>${g.approx?'<span>Position approximative</span>':''}<button>Ouvrir la page</button></div>`);
  m.on('popupopen',e=>{e.popup.getElement().querySelector('button').onclick=()=>openBuilding(b.id)});
  return m}
function mapMessage(t,act,label){app.innerHTML=`<div class="top"><h1>Carte</h1></div><div class="empty-msg">${esc(t)}</div><div class="foot" style="margin-top:auto;display:grid;gap:8px">${act?`<button class="btn" data-act="${act}">${esc(label)}</button>`:''}<button class="btn main" data-act="back">Retour à la liste</button></div>`}
async function renderMap(){
  const tok=mapToken;
  if(navigator.onLine===false){mapMessage('La carte demande une connexion. La saisie reste disponible sans réseau.');return}
  if(!S.city||!S.postcode){mapMessage('Indiquez d\'abord le code postal et la ville de référence dans les réglages.','menu','Ouvrir les réglages');return}
  app.innerHTML=`<div class="top"><h1>Carte</h1></div><div class="mapwrap"><div id="map"></div></div><div class="mapmsg" id="mapmsg">Chargement…</div>
  <div class="legend"><span><i class="dot n"></i>Pas visité</span><span><i class="dot a"></i>À repasser</span><span><i class="dot d"></i>Traité</span></div>
  <div class="foot"><button class="btn main" data-act="back">Retour à la liste</button></div>`;
  const msg=document.getElementById('mapmsg');
  try{await loadLeaflet()}catch(e){msg.textContent='Impossible de charger la carte. Réessayez avec du réseau.';return}
  if(tok!==mapToken)return;
  mapObj=L.map('map',{zoomControl:true}).setView([46.6,2.4],6);
  L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',{maxNativeZoom:19,maxZoom:20,attribution:'Plan IGN, adresses BAN'}).addTo(mapObj);
  const layer=L.layerGroup().addTo(mapObj);
  const fit=()=>{const pts=S.buildings.filter(b=>b.geo&&b.geo.lat!==undefined&&b.geo.key===geoQuery(b)).map(b=>[b.geo.lat,b.geo.lon]);if(pts.length)mapObj.fitBounds(pts,{padding:[36,36],maxZoom:18})};
  S.buildings.forEach(b=>{if(b.geo&&b.geo.lat!==undefined&&b.geo.key===geoQuery(b))addPin(b,layer)});fit();
  const todo=S.buildings.filter(b=>!b.geo||b.geo.key!==geoQuery(b));let netFail=false;
  for(let i=0;i<todo.length;i++){
    if(tok!==mapToken)return;
    msg.textContent=`Placement des adresses : ${i+1} sur ${todo.length}`;
    const b=todo[i],q=geoQuery(b);
    try{const u=`https://data.geopf.fr/geocodage/search?q=${encodeURIComponent(q)}&postcode=${encodeURIComponent(S.postcode)}&index=address&autocomplete=0&limit=1`;
      const r=await fetch(u);if(!r.ok)throw 0;const f=(await r.json()).features[0];
      if(f&&f.properties.score>=0.4){b.geo={key:q,lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],approx:f.properties.type!=='housenumber'};if(tok===mapToken)addPin(b,layer)}
      else b.geo={key:q};
    }catch(e){netFail=true;break}
    await new Promise(r=>setTimeout(r,120));
  }
  save(false);if(tok!==mapToken)return;fit();
  const lost=S.buildings.filter(b=>b.geo&&b.geo.key===geoQuery(b)&&b.geo.lat===undefined);
  msg.textContent=netFail?'Le service d\'adresses ne répond pas : certaines adresses ne sont pas placées.':lost.length?`Non trouvées : ${lost.map(title).join(', ')}.`:'';
}

function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function dialog(t,msg,ok,fn){const d=document.createElement('div');d.className='scrim';
  d.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true"><h2>${esc(t)}</h2><p>${esc(msg)}</p><div><button class="btn" id="dNo">Annuler</button><button class="btn main" style="font-size:17px" id="dOk">${esc(ok)}</button></div></div>`;
  document.body.appendChild(d);d.querySelector('#dNo').onclick=()=>d.remove();d.querySelector('#dOk').onclick=()=>{d.remove();fn()}}
async function exportData(){
  const name=`tournee-${latest()}.json`,data={...S,open:null};
  const file=new File([JSON.stringify(data,null,1)],name,{type:'application/json'});
  const done=()=>{S.lastExport=Date.now();save(false);render();toast('Sauvegarde créée.')};
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done();return} }
  catch(e){ if(e.name==='AbortError'){toast('Sauvegarde annulée.');return} }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);done();
}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.buildings)||!Array.isArray(d.seasons))throw 0;
    dialog('Restaurer cette sauvegarde ?',`${d.buildings.length} adresses. Les données actuelles seront remplacées.`,'Restaurer',()=>{S=migrate(Object.assign(blank(),d,{open:null,theme:S.theme}));save(false);go('list');toast('Sauvegarde restaurée.')})
  }catch(_){toast("Ce fichier n'est pas une sauvegarde de l'application.")}});

/* ---------- Navigation ---------- */
function render(){mapToken++;if(mapObj){mapObj.remove();mapObj=null}({list:renderList,building:renderBuilding,edit:renderEdit,menu:renderMenu,map:renderMap})[view.name]()}
function go(name,id){view={name,id};render()}
function openBuilding(id){if(!readOnly()){S.open={id,start:Date.now()};save(false)}go('building',id)}
document.addEventListener('click',e=>{
  const cell=e.target.closest('.c');
  if(cell){if(lpFired){lpFired=false;return}tapCell(cell);return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,b=view.id&&byId(view.id);
  if(a==='new')go('edit');
  else if(a==='menu')go('menu');
  else if(a==='map')go('map');
  else if(a==='syncon')activateSync();
  else if(a==='syncnow'){sync.error='';pushNow(true).then(()=>toast(sync.error?'Envoi impossible.':navigator.onLine===false?'Pas de réseau pour le moment.':'Envoyé sur GitHub.'))}
  else if(a==='syncrestore')restoreSync();
  else if(a==='syncoff')dialog('Désactiver la sauvegarde GitHub ?','Le jeton est effacé de ce téléphone. La sauvegarde déjà envoyée reste sur GitHub.','Désactiver',()=>{sync={};try{localStorage.removeItem(SYNC_KEY)}catch(e){}render()});
  else if(a==='back')go('list');
  else if(a==='clear'){query='';render()}
  else if(a==='open')openBuilding(t.dataset.id);
  else if(a==='close'){S.open=null;save(false);go('list');pushNow()}
  else if(a==='edit')go('edit',view.id);
  else if(a==='cancel'){view.id?go('building',view.id):go('list')}
  else if(a==='saveaddr')saveAddr(false);
  else if(a==='force')saveAddr(true);
  else if(a==='stype')setType(t.dataset.t);
  else if(a==='clearname'){const n=document.getElementById('f-street');n.value='';n.focus()}
  else if(a==='usename'){const x=byId(t.dataset.id);document.getElementById('f-street').value=x.sname;setType(x.stype);saveAddr(false)}
  else if(a==='floor'){if(readOnly())return;const f=b.floors[+t.dataset.f];f.off=!f.off;save();const y=document.getElementById('grid').scrollTop;render();document.getElementById('grid').scrollTop=y}
  else if(a==='addfloor'){b.floors.push({off:false});save();render();const g=document.getElementById('grid');g.scrollTop=g.scrollHeight}
  else if(a==='rmfloor'){b.floors.pop();save();render()}
  else if(a==='delete')dialog('Supprimer cette adresse ?',`${title(b)} et tous ses passages seront effacés, y compris ceux des années précédentes.`,'Supprimer',()=>{S.buildings=S.buildings.filter(x=>x.id!==b.id);S.open=null;save();go('list');toast('Adresse supprimée.')});
  else if(a==='export')exportData();
  else if(a==='import')document.getElementById('importFile').click();
  else if(a==='season'){S.season=+t.dataset.y;S.open=null;save(false);go('list')}
  else if(a==='newseason'){const y=latest()+1;dialog(`Commencer la tournée ${y} ?`,'Les adresses et les étages sont repris, les cases repartent vides. La tournée précédente reste consultable.','Commencer',()=>{S.seasons.push(y);S.season=y;S.open=null;save();go('list');toast(`Tournée ${y} commencée.`)})}
  else if(a==='reset')dialog('Effacer toutes les données ?',`${S.buildings.length} adresses et toutes les tournées seront supprimées de ce téléphone. Sans fichier de sauvegarde, elles seront perdues.`,'Tout effacer',()=>{const theme=S.theme;S=blank();S.theme=theme;query='';save(false);go('list');toast('Toutes les données sont effacées.')});
  else if(a==='theme'){S.theme=t.dataset.t;save(false);applyTheme();render()}
});

/* ---------- Démarrage ---------- */
S=load();
if(framed&&!S.buildings.length){const y=S.season,mk=(num,street,code,notes,cs,off)=>{const fl=newFloors();(off||[]).forEach(i=>fl[i].off=true);return{id:'ex'+num+street.length,num,street,code,notes,floors:fl,visits:{[y]:cs}}},old=1;
  S.buildings=[mk('12','Rue des Exemples','47B21','Interphone : Martin',{'0-0-0':{s:'A',t:old},'0-0-1':{s:'X',t:old},'0-1-0':{s:'X',t:old},'1-0-0':{s:'R',t:old},'1-2-0':{s:'A',t:old},'2-3-0':{s:'A',t:old},'3-0-0':{s:'X',t:old}},[5]),mk('14 bis','Rue des Exemples','','',{'0-0-0':{s:'X',t:old}}),mk('3','Avenue de la Démo','1985','',{})]}
migrate(S);
applyTheme();
if(S.open&&byId(S.open.id)&&Date.now()-S.open.start<SESSION_MAX&&!readOnly())view={name:'building',id:S.open.id};
else if(S.open){S.open=null;save(false)}
render();
if(!S.buildings.length&&!framed){try{idb('readonly',s=>s.get('data')).then(j=>{if(!j)return;const d=JSON.parse(j);if(d.buildings&&d.buildings.length&&!S.buildings.length){S=migrate(Object.assign(blank(),d));save(false);render();toast('Données récupérées depuis la copie de secours.')}}).catch(()=>{})}catch(e){}}
if(!framed){window.addEventListener('online',()=>pushNow());document.addEventListener('visibilitychange',()=>pushNow());setInterval(()=>pushNow(),60000);pushNow()}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&!framed)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
